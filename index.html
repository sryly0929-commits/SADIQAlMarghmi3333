header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--green);color:#fff;position:sticky;top:0;z-index:2}
.admin-entry{background:#fff;color:var(--green);border:1px solid #d6f2e9;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:bold;white-space:nowrap;margin-right:auto}.avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.avatar{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:#ffffff22;border:1px solid #ffffff55;font-size:22px}

.bubble{max-width:94%;padding:11px 13px;border-radius:14px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.bot{align-self:flex-start;background:#fff;border:1px solid #e7e2da;border-bottom-right-radius:4px;box-shadow:0 1px 1px #0000000a}
.user{align-self:flex-end;background:#d9fdd3;border:1px solid #c5edbd;border-bottom-left-radius:4px;box-shadow:0 1px 1px #0000000a}
.sender{font-size:10px;color:#72818a;margin-bottom:4px}
#action{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
#action h2{font-size:15px;color:var(--green);margin:0 0 7px}
#action p{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 10px}
.typing-indicator{font-size:13px;font-weight:600;color:#1687ff;min-height:20px;margin:0 0 4px;text-align:right}
label{display:block;font-size:13px;margin:8px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid #cbd9d6;border-radius:9px;font:inherit;font-size:14px;margin:4px 0 10px;color:var(--ink);background:#fff}
button{font:inherit;font-size:14px;border:0;border-radius:9px;padding:12px 14px;cursor:pointer}
button:focus,input:focus{outline:2px solid #72b8ae;outline-offset:1px}
.primary{background:var(--accent);color:#fff;width:100%;font-weight:bold}.primary:disabled{opacity:.55;cursor:not-allowed}.send-button{width:48px;height:48px;padding:0;border-radius:50%;font-size:25px;line-height:1;display:block;margin:8px 0 0 auto}
.light{background:#edf4f2;border:1px solid #d4e2de;color:var(--green)}
.options{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.options button{flex:1 1 42%;background:#e7f4e4;border:1px solid #cce8c6;color:#174c42;min-height:44px}
.row{display:flex;gap:8px}.row button{flex:1}
.small{font-size:11px;color:var(--muted);line-height:1.8}
.whatsapp{display:block;text-decoration:none;background:#25d366;color:#063b20;text-align:center;font-weight:bold;border-radius:10px;padding:14px;margin-top:8px}
.success-line{display:block;margin-top:4px;font-size:12px;font-weight:normal;color:var(--accent)}
.hidden{display:none!important}
footer{text-align:center;padding:12px;border-top:1px solid #ded8cf;background:#f7f3ed;font-size:11px;color:#71849a}
@media(max-width:480px){main{padding:10px}.bubble{max-width:100%;font-size:13px}header h1{font-size:15px}.status{display:none}}
</style>
</head>

<script>

const data={name:'',birthYear:'',country:'',educationWork:'',workDetails:'',duration:'',wish:'',future:'',summary:'',interest:'',confidence:'',permission:'',send:'',appointment:'',time:'',correction:'',clarification:'',source:'',watched:''};

try{if(localStorage.getItem('sadiq_admin_password')==='2468')localStorage.setItem('sadiq_admin_password',ADMIN_PASSWORD);}catch(e){}
const QUESTION_TITLES={permission:'الموافقة على متابعة الأسئلة',workDetails:'العمل الحالي',duration:'مدة العمل',wish:'ما الذي ترغب في تحسينه',future:'التفكير في المستقبل',summary:'تأكيد الفهم الأول',correction:'تصحيح الفهم',summary2:'تأكيد الفهم بعد التصحيح',interest:'مدى مناسبة الفرصة',confidence:'الثقة بالبدء',continue:'',send:'إرسال المواد التعريفية',customTime:'تحديد موعد متابعة',appointment:'موعد مشاهدة العرض',watched:'تأكيد مشاهدة العرض',ready:'الاستعداد للنقاش',liked:'ما لفت الانتباه',companyAge:'عمر الشركة',members:'عدد أعضاء الشركة',countries:'الدول التي تتواجد فيها الشركة',products:'معرفة المنتجات',global:'معنى الانتشار العالمي',persistence:'المثابرة تجاه كلام الناس',incomeType:'نوع الدخل المفضل',incomeGoal:'الطموح المالي',dailyTime:'الوقت اليومي المتاح',longTerm:'الاستعداد للتعلم طويل الأمد',training:'الاستعداد للتدريب'};
const QUESTION_DEFAULTS={permission:'هل تسمح لي أن أسألك بعض الأسئلة البسيطة؟',workDetails:'هل أنت طالب أم موظف؟ وما هو عملك الحالي؟',duration:'ومنذ متى وأنت تعمل في هذا المجال؟',wish:'ما أكثر شيء تتمنى أن يتحسن في وضعك الحالي أو عملك؟',future:'ولو بقي وضعك كما هو اليوم خلال السنوات الخمس القادمة، هل ستكون راضيًا عن النتيجة؟',summary:'هل هذا صحيح؟',correction:'ما الذي تريد تصحيحه في فهمي لاحتياجك؟',summary2:'هل فهمت احتياجك بشكل صحيح؟',interest:'هل هذا هو ما تبحث عنه؟',confidence:'هل سيعطيك ذلك ثقة أكبر للبدء؟',continue:'هل ترغب في متابعة الخطوة التالية؟',send:'هل يناسبك أن أرسل لك المواد التعريفية؟',customTime:'متى يناسبك أن نتابع؟ اكتب الوقت الذي يناسبك.',appointment:'اكتب الوقت الذي يناسبك لمشاهدة العرض.',watched:'أخبرني عندما تنتهي من مشاهدة العرض.',ready:'هل أنت جاهز؟',liked:'من خلال مشاهدتك الفيديوهات السابقة، ما الشيء الذي لفت انتباهك واهتمامك وأعجبك؟',companyAge:'كم عمر الشركة، وماذا يعني لك هذا العمر؟',members:'كم عدد أعضاء الشركة، وماذا يعني لك هذا الرقم؟',countries:'في كم دولة تتواجد الشركة، وماذا يعني لك هذا الانتشار؟',products:'من خلال اطلاعك على كتالوج المنتجات، هل يمكنك ذكر عدد من المنتجات؟',global:'من منظور تجاري، ماذا تعني لك العضوية العالمية والفروع في دول متعددة والمنتجات المتنوعة؟',persistence:'هل أنت من الأشخاص الذين يتأثرون بكلام الناس ويتوقفون، أم أنك تصرّ على هدفك ولا تستسلم من أول محاولة؟',incomeType:'لو تم قبولك معنا، ماذا تفضّل: راتبًا ثابتًا أم نسبةً حسب الجهد والنتائج؟',incomeGoal:'ما طموحك المالي؟ كم تتمنى أن يكون دخلك الشهري؟',dailyTime:'هل تستطيع تخصيص ساعتين إلى ثلاث ساعات يوميًا على الأقل للتعلم والعمل؟',longTerm:'هل أنت مستعد للتعلم وبذل الجهد على مدى سنتين إلى ثلاث سنوات؟',training:'هل أنت مستعد للتدرب والتعلم وتنفيذ المهام اليومية واتباع إرشادات التدريب؟'};
function getQuestionOverrides(){try{return JSON.parse(localStorage.getItem('sadiq_question_overrides')||'{}')}catch(e){return {}}}
function renderQuestionEditor(){const ov=getQuestionOverrides();show('تعديل صياغة الأسئلة','',`<p class="small">غيّر نص السؤال الذي سيظهر للمشاركين. اترك الحقل فارغًا لإبقاء السؤال الأصلي. التغييرات محفوظة محليًا على هذا الجهاز.</p><div id="questionEditor">${Object.entries(QUESTION_DEFAULTS).map(([key,text])=>`<label for="q-${key}">${escapeHtml(key)}</label><textarea id="q-${key}" rows="2" placeholder="${escapeHtml(text)}">${escapeHtml(ov[key]||'')}</textarea>`).join('')}</div><button class="primary" onclick="saveQuestionEdits()">حفظ التعديلات</button><button class="light" style="width:100%;margin-top:8px" onclick="renderAdmin()">العودة للوحة التحكم</button>`);}
function saveQuestionEdits(){const ov={};for(const key of Object.keys(QUESTION_DEFAULTS)){const v=document.getElementById('q-'+key).value.trim();if(v)ov[key]=v;}localStorage.setItem('sadiq_question_overrides',JSON.stringify(ov));alert('تم حفظ صياغة الأسئلة على هذا الجهاز.');renderQuestionEditor();}
let currentRecord={id:Date.now(),startedAt:new Date().toISOString(),name:'',answers:[],status:'قيد المتابعة'};
function normalizedMediaProgress(value){const fallback={current:[0,0,0],furthest:[0,0,0],completed:[false,false,false]};if(!value||typeof value!=='object')return fallback;for(let i=0;i<3;i++){fallback.current[i]=Math.max(0,Number(value.current?.[i])||0);fallback.furthest[i]=Math.max(0,Number(value.furthest?.[i])||0);fallback.completed[i]=Boolean(value.completed?.[i]);}return fallback;}
function saveProgress(){if(progressRestoring||adminUnlocked)return;try{if(progressMode==='media'){action.querySelectorAll('video[data-required-video]').forEach((v,i)=>{if(Number.isFinite(v.currentTime)&&v.readyState>0)mediaProgress.current[i]=v.currentTime;});}const draft={answer:document.getElementById('answer')?.value||'',candidateName:document.getElementById('candidateName')?.value||'',candidatePlace:document.getElementById('candidatePlace')?.value||'',candidateWork:document.getElementById('candidateWork')?.value||''};const snapshot={version:1,started,mode:progressMode,data,currentRecord,chatHtml:chat.innerHTML,actionHtml:progressMode==='media'?'':action.innerHTML,mediaProgress,draft,savedAt:Date.now()};localStorage.setItem(PROGRESS_KEY,JSON.stringify(snapshot));}catch(e){}}
function allVideosWatched(){return mediaProgress.completed.length===3&&mediaProgress.completed.every(Boolean);}
function updateVideoAccess(){const videos=[...action.querySelectorAll('video[data-required-video]')];videos.forEach((v,i)=>{const allowed=i===0||mediaProgress.completed.slice(0,i).every(Boolean);v.controls=allowed;v.style.pointerEvents=allowed?'auto':'none';v.style.opacity=allowed?'1':'.55';v.setAttribute('aria-disabled',allowed?'false':'true');if(!allowed)v.pause();});const all=allVideosWatched();const box=document.getElementById('answer'),button=document.getElementById('watched-submit'),note=document.getElementById('mandatory-watch-status');if(box)box.disabled=!all;if(button)button.disabled=!all;if(note)note.textContent=all?'اكتملت مشاهدة المقاطع الثلاثة. يمكنك المتابعة الآن.':`المشاهدة إلزامية بالترتيب: أكمل الفيديو ${mediaProgress.completed.findIndex(x=>!x)+1} من 3 للمتابعة.`;if(all)document.getElementById('videoWatchError')?.remove();}
function initializeRequiredVideos(){const videos=[...action.querySelectorAll('video[data-required-video]')];mediaProgress=normalizedMediaProgress(mediaProgress);videos.forEach((v,i)=>{const updatePosition=()=>{if(!v.seeking){if(!v.paused&&!mediaProgress.completed[i])mediaProgress.furthest[i]=Math.max(mediaProgress.furthest[i],v.currentTime);mediaProgress.current[i]=v.currentTime;}const now=Date.now();if(now-(v._lastProgressSave||0)>900){v._lastProgressSave=now;saveProgress();}};v.addEventListener('loadedmetadata',()=>{const duration=Number.isFinite(v.duration)?v.duration:0;const target=Math.min(mediaProgress.current[i]||0,mediaProgress.completed[i]?(duration||0):(mediaProgress.furthest[i]||0),duration||0);if(target>0)try{v.currentTime=target;}catch(e){}updateVideoAccess();saveProgress();},{once:true});v.addEventListener('seeking',()=>{if(!mediaProgress.completed[i]&&v.currentTime>mediaProgress.furthest[i]+0.4){const max=Math.max(0,mediaProgress.furthest[i]);try{v.currentTime=max;}catch(e){}}});v.addEventListener('seeked',()=>{if(!mediaProgress.completed[i]&&v.currentTime>mediaProgress.furthest[i]+0.4){mediaProgress.current[i]=mediaProgress.furthest[i];try{v.currentTime=mediaProgress.furthest[i];}catch(e){}saveProgress();return;}mediaProgress.current[i]=v.currentTime;saveProgress();});v.addEventListener('timeupdate',updatePosition);v.addEventListener('ended',()=>{mediaProgress.completed[i]=true;mediaProgress.current[i]=v.duration;mediaProgress.furthest[i]=v.duration;updateVideoAccess();saveProgress();});v.addEventListener('play',()=>{const allowed=i===0||mediaProgress.completed.slice(0,i).every(Boolean);if(!allowed)v.pause();});});updateVideoAccess();}
function bindProgressDrafts(){
 ['answer','candidateName','candidatePlace','candidateWork'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',saveProgress);});
 const input=document.getElementById('answer'),indicator=document.getElementById('typingIndicator');
 if(input&&indicator){let typingTimer;const updateTyping=()=>{clearTimeout(typingTimer);if(input.value.trim()){indicator.classList.remove('hidden');typingTimer=setTimeout(()=>indicator.classList.add('hidden'),1100);}else indicator.classList.add('hidden');};input.oninput=updateTyping;updateTyping();}
}
function restoreProgress(){let saved;try{saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');}catch(e){return false;}if(!saved||!saved.started||saved.mode==='start')return false;progressRestoring=true;try{Object.assign(data,saved.data||{});if(saved.currentRecord)currentRecord=saved.currentRecord;started=true;progressMode=saved.mode||'question';mediaProgress=normalizedMediaProgress(saved.mediaProgress);chat.innerHTML=saved.chatHtml||'';if(progressMode==='media'){showMedia(true);}else{action.innerHTML=saved.actionHtml||'';}const d=saved.draft||{};for(const [id,key] of [['answer','answer'],['candidateName','candidateName'],['candidatePlace','candidatePlace'],['candidateWork','candidateWork']]){const el=document.getElementById(id);if(el&&typeof d[key]==='string')el.value=d[key];}bindProgressDrafts();}catch(e){progressRestoring=false;return false;}progressRestoring=false;if(progressMode==='waiting')checkPendingAppointment();saveProgress();return true;}
window.addEventListener('pagehide',saveProgress);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveProgress();else if(progressMode==='waiting')checkPendingAppointment();});

function persistRecord(){try{const rows=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');const i=rows.findIndex(r=>r.id===currentRecord.id);if(i>=0)rows[i]=JSON.parse(JSON.stringify(currentRecord));else rows.unshift(JSON.parse(JSON.stringify(currentRecord)));localStorage.setItem(STORE_KEY,JSON.stringify(rows));}catch(e){}}
function recordAnswer(question,answer){currentRecord.answers.push({question,answer,at:new Date().toISOString()});persistRecord();}
function normalizeForValidation(value){return String(value??'').normalize('NFKD').replace(/[\u064B-\u065F\u0670\u0640]/g,'').toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[\u200e\u200f]/g,'').trim();}
function validateNaturalAnswer(key,value){
 if(key==='interest'||key==='duration'||key==='appointment'||key==='customTime'||key==='products'||key==='salaryDirection')return String(value||'').trim().length>0;
 if(key==='incomeType'&&isBusinessPreference(value))return true;
 const s=normalizeForValidation(value), compact=s.replace(/[\s.,،؛:!?؟؛()\[\]{}"'`~@#$%^&*_+=<>\/\\|-]/g,'');
 if(!compact||(/^(.)\1+$/.test(compact)&&!(key==='companyAge'&&/^[0-9٠-٩۰-۹]+$/.test(compact))))return false;
 const numericKeys=['incomeGoal','companyAge','countries','members'];
 const hasLetters=/[a-z\u0600-\u06ff]/i.test(s),hasNumber=/[0-9٠-٩۰-۹]/.test(s);
 if(!hasLetters&&!numericKeys.includes(key))return false;
 const tokens=s.match(/[a-z\u0600-\u06ff0-9٠-٩۰-۹]+/gi)||[];
 const words=tokens.filter(t=>/[a-z\u0600-\u06ff]/i.test(t));
 if(words.some(w=>w.length===1)&&words.filter(w=>w.length>1).length===0&&!numericKeys.includes(key))return false;
 const yes=/^(نعم|اي|ايوه|أيوه|اه|اجل|أجل|موافق|موافقة|تمام|اكيد|أكيد|بالتأكيد|مستعد|مستعدة|نعم بالتأكيد|yes|yeah|ok|okay)$/i;

 const yesNo=/نعم|ايوه|أيوه|موافق|موافقة|تمام|أكيد|اكيد|مستعد|مستعدة|لا|كلا|مش|غير موافق|غير موافقة|yes|no/i;
 const timeWord=/الان|الآن|اليوم|غدا|غداً|بكره|بكرة|بعد|ساعة|ساعه|صباح|مساء|الليل|المساء|الصباح|اسبوع|أسبوع|يوم|موعد|الساعه|الساعة|\d{1,2}[:.]\d{2}|\d{1,2}\s*(صباح|مساء|am|pm)/i;

function hiddenAdminTap(){adminTaps++;clearTimeout(adminTapTimer);adminTapTimer=setTimeout(()=>adminTaps=0,1800);if(adminTaps>=5){adminTaps=0;openAdmin();}}
function openAdmin(){const pw=prompt('لوحة الإدارة الخاصة — أدخل كلمة المرور');if(pw===null)return;const saved=localStorage.getItem('sadiq_admin_password')||ADMIN_PASSWORD;if(pw!==saved){alert('كلمة المرور غير صحيحة');return;}adminUnlocked=true;renderAdmin();enableBubbleEditing();}
function renderAdmin(){const rows=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');show('لوحة الإدارة الداخلية','',`<p class="small">هذه السجلات محفوظة في هذا المتصفح والجهاز فقط، وليست قاعدة بيانات مشتركة عبر الإنترنت. الإجابات المفتوحة تحتاج إلى حكمك؛ ويظهر تقييم تلقائي فقط للأسئلة ذات المعلومة المحددة في نص الروبوت.</p><button class="light" onclick="renderQuestionEditor()">تعديل صياغة الأسئلة</button><button class="light" onclick="changeAdminPassword()">تغيير كلمة المرور</button><button class="light" onclick="exportRecords()">تصدير البيانات JSON</button><button class="light" onclick="showAdminRecords()">تحديث السجلات (${rows.length})</button><div id="adminRows"></div><button class="primary" onclick="restart()">العودة للمحادثة</button>`);showAdminRecords();}
function expectedAnswer(question,answer){const q=String(question||''),a=String(answer||'');if(/كم عمر الشركة/.test(q))return /ربع\s*قرن|25\s*عام|خمسة وعشرون/i.test(a)?'متوافقة مع المعلومة المعتمدة (25 عامًا)':'غير متوافقة مع المعلومة المعتمدة (25 عامًا)';if(/في كم دولة/.test(q))return /180|مئة وثمانين|مائة وثمانين|مئة وثمانون|مائة وثمانون/i.test(a)?'متوافقة مع المعلومة المعتمدة (180 دولة)':'غير متوافقة مع المعلومة المعتمدة (180 دولة)';return 'تحتاج إلى مراجعة يدوية — إجابة مفتوحة';}
function setAnswerReview(recordId,index,value){const rows=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');const r=rows.find(x=>String(x.id)===String(recordId));if(!r||!r.answers||!r.answers[index])return;r.answers[index].review=value;localStorage.setItem(STORE_KEY,JSON.stringify(rows));showAdminRecords();}
function showAdminRecords(){const host=document.getElementById('adminRows');if(!host)return;const rows=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');host.innerHTML=rows.length?rows.map(r=>`<details style=\"background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0\"><summary><b>${escapeHtml(r.name||'مرشح دون اسم')}</b> — ${escapeHtml(r.status||'قيد المتابعة')} (${(r.answers||[]).length} إجابة)</summary><p class=\"small\">بدأ: ${escapeHtml(r.startedAt||'')}<br>ملاحظة: السجلات محفوظة على هذا الجهاز فقط.</p>${(r.answers||[]).map((a,i)=>{const auto=expectedAnswer(a.question,a.answer);return `<div style=\"border-top:1px solid #eee;padding:8px 0\"><b>${escapeHtml(a.question)}</b><br><span>${escapeHtml(a.answer)}</span><p class=\"small\">التقييم: ${escapeHtml(a.review||auto)}</p><div class=\"row\"><button type=\"button\" class=\"light\" onclick=\"setAnswerReview('${String(r.id).replace(/'/g,'')}',${i},'صحيح')\">تحديد صحيح</button><button type=\"button\" class=\"light\" onclick=\"setAnswerReview('${String(r.id).replace(/'/g,'')}',${i},'غير صحيح')\">تحديد غير صحيح</button><button type=\"button\" class=\"light\" onclick=\"setAnswerReview('${String(r.id).replace(/'/g,'')}',${i},'مراجعة يدوية')\">مراجعة يدوية</button></div></div>`}).join('')}</details>`).join(''):'<p>لا توجد إجابات محفوظة على هذا الجهاز حتى الآن.</p>'; }
function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function changeAdminPassword(){const p=prompt('أدخل كلمة مرور جديدة (4 أحرف/أرقام على الأقل)');if(!p)return;if(p.length<4){alert('اجعل كلمة المرور 4 أحرف أو أكثر');return;}localStorage.setItem('sadiq_admin_password',p);alert('تم تغيير كلمة المرور على هذا الجهاز.');}
function exportRecords(){const rows=localStorage.getItem(STORE_KEY)||'[]';const blob=new Blob([rows],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='candidate-records.json';a.click();URL.revokeObjectURL(a.href);}

function getBubbleEdits(){try{return JSON.parse(localStorage.getItem('sadiq_bubble_edits')||'{}')}catch(e){return {}}}
function editBotBubble(original,b){const edits=getBubbleEdits(),old=edits[original]||{text:original,extra:''};const updated=prompt('عدّل نص هذه الرسالة. احذف النص إن أردت إخفاءه:',old.text);if(updated===null)return;const extra=prompt('أضف كلمات أخرى إلى المربع نفسه (اتركه فارغًا إن لم تحتج):',old.extra||'');if(extra===null)return;edits[original]={text:updated,extra};localStorage.setItem('sadiq_bubble_edits',JSON.stringify(edits));const t=b.querySelector('.bubble-text');if(t)t.textContent=[updated,extra].filter(Boolean).join('\n');}
function addBubbleEditButton(b){if(!adminUnlocked||b.querySelector('.bubble-edit'))return;const original=b.dataset.originalText||'';const button=document.createElement('button');button.type='button';button.className='bubble-edit light';button.textContent='تعديل هذه الرسالة';button.style.cssText='font-size:11px;padding:6px 9px;margin-top:7px';button.onclick=()=>editBotBubble(original,b);b.appendChild(button);}
function enableBubbleEditing(){document.querySelectorAll('.bubble.bot').forEach(addBubbleEditButton);}
function addBubble(text,who='bot',sender=who==='bot'?'صادق المرغمي':'أنت'){
 const original=String(text??'');let shown=original;if(who==='bot'){const edits=getBubbleEdits()[original];if(edits)shown=[edits.text,edits.extra].filter(Boolean).join('\n');}
 const b=document.createElement('div');b.className='bubble '+who;b.dataset.originalText=original;const s=document.createElement('div');s.className='sender';s.textContent=sender;b.appendChild(s);const t=document.createElement('div');t.className='bubble-text';t.textContent=shown;b.appendChild(t);if(who==='bot')addBubbleEditButton(b);chat.appendChild(b);setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'nearest'}),30);if(!adminUnlocked)saveProgress();
}
function show(title,desc,body){action.innerHTML=`${title?`<h2>${title}</h2>`:''}${body}`;if(progressMode!=='media')saveProgress();}
function ask(title,question,key,placeholder='اكتب إجابتك هنا'){
 const overrides=getQuestionOverrides();const actualQuestion=overrides[key]||question;progressMode='question';
 const displayTitle=/^السؤال(?:\s|$)/.test(title)?'':title;
 if(actualQuestion)addBubble(actualQuestion);currentRecord.lastQuestion=actualQuestion||title;persistRecord();show(displayTitle,'',`<div id="typingIndicator" class="typing-indicator hidden" aria-live="polite">جاري الكتابة</div><form onsubmit="submitAnswer('${key}');return false"><textarea id="answer" rows="3" required aria-label="الإجابة" inputmode="${key==='companyAge'?'numeric':'text'}" placeholder="${key==='companyAge'?'اكتب العمر بالأرقام فقط، مثل 27':placeholder}"></textarea><button class="primary send-button" type="submit" aria-label="إرسال" title="إرسال">➤</button></form>`);bindProgressDrafts();saveProgress();
}

 }
 else if(key==='businessReady'){

function askProjectQuestion(){addBubble(`ولو وجدت ${goalContext()}...\nهل هذه فرصة تبحث عنها؟`);ask('الفرصة المناسبة','','interest','اكتب إجابتك هنا');}
function normalizeAppointmentText(value){
 return String(value??'').replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[ًٌٍَُِّْـ]/g,'').toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u200e\u200f]/g,'').replace(/\s+/g,' ').trim();
}
function parseAppointment(value){
 const t=normalizeAppointmentText(value),now=Date.now();
 if(/(^|\s)(الان|الحين|دحين|حاليا)(\s|$)/.test(t)||/انا فاضي|انا متفرغ|جاهز الان/.test(t))return {kind:'now',at:now};
 const numberWords={
  'واحد':1,'واحده':1,'اولى':1,'الاولى':1,'الواحده':1,
  'اثنين':2,'اثنتين':2,'اثنان':2,'اثنتا':2,'الثانيه':2,
  'ثلاث':3,'ثلاثه':3,'الثالثه':3,
  'اربع':4,'اربعه':4,'الرابعه':4,
  'خمس':5,'خمسه':5,'الخامسه':5,
  'ست':6,'سته':6,'السادسه':6,
  'سبع':7,'سبعه':7,'السابعه':7,
  'ثمان':8,'ثمانيه':8,'الثامنه':8,
  'تسع':9,'تسعه':9,'التاسعه':9,
  'عشر':10,'عشره':10,'العاشره':10,
  'احد عشر':11,'احدى عشر':11,'الحاديه عشره':11,'الحادي عشر':11,
  'اثنا عشر':12,'اثني عشر':12,'اثنتا عشر':12,'الثانيه عشره':12,
  'ثلاثه عشر':13,'الثالثه عشره':13,'اربعه عشر':14,'الرابعه عشره':14,
  'خمسه عشر':15,'الخامسه عشره':15,'سته عشر':16,'سته عشره':16,'السادسه عشره':16,
  'سبعه عشر':17,'السابعه عشره':17,'ثمانيه عشر':18,'الثامنه عشره':18,
  'تسعه عشر':19,'التاسعه عشره':19,'عشرين':20,'عشرون':20,
  'ثلاثين':30,'ثلاثون':30,'اربعين':40,'اربعون':40,'خمسين':50,'خمسون':50,
  'ستين':60,'ستون':60,'سبعين':70,'سبعون':70,'ثمانين':80,'ثمانون':80,'تسعين':90,'تسعون':90,
  'واحد وعشرين':21,'واحد وعشرون':21,'اثنين وعشرين':22,'اثنين وعشرون':22,
  'ثلاثه وعشرين':23,'ثلاث وعشرين':23,'اربعه وعشرين':24,'اربع وعشرين':24
 };
 const escapeRegex=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
 const words=Object.keys(numberWords).sort((a,b)=>b.length-a.length).map(escapeRegex).join('|');
 let minutes=null;
 if(/^(?:بعد\s*)?(?:نصف|نص)\s*ساعه$/.test(t))minutes=30;
 else if(/^(?:بعد\s*)?ربع\s*ساعه$/.test(t))minutes=15;
 else if(/^(?:بعد\s*)?ساعه\s*ونصف$/.test(t)||/^(?:بعد\s*)?ساعه\s*ونص$/.test(t))minutes=90;
 else if(/^(?:بعد\s*)?ساعتين\s*ونصف$/.test(t))minutes=150;
 else if(/^(?:بعد\s*)?ساعتين$/.test(t))minutes=120;
 else if(/^(?:بعد\s*)?يوم(?:\s*واحد|\s*كامل)?$/.test(t))minutes=24*60;
 else if(/^(?:بعد\s*)?دقيقتين$/.test(t))minutes=2;
 else if(/^(?:بعد\s*)?دقيقه$/.test(t))minutes=1;
 else if(/^(?:بعد\s*)?ساعه$/.test(t))minutes=60;
 else {
  const unit='دقيقتين|دقيقتان|دقائق|دقيقه|دقايق|دقيق|min(?:ute)?s?|ساعتين|ساعتان|ساعات|ساعه|hour(?:s)?';
  const duration=t.match(new RegExp('(?:^|\\s)(?:بعد\\s*)?(\\d{1,5}|'+words+')\\s*('+unit+')(?=\\s|$)','i'));
  if(duration){const token=duration[1].replace(/\s+/g,' ');const n=/^\d+$/.test(token)?Number(token):numberWords[token];if(Number.isFinite(n)){minutes=/^(?:دقيق|دقائ|دقايق|min)/i.test(duration[2])?n:n*60;}}
 }
 if(minutes!==null){if(minutes<1||minutes>24*60)return {kind:'range'};return {kind:'future',at:now+minutes*60000};}
 let hour=null,minute=0,explicitMinutes=false;
 const clock=t.match(/(?:^|\s)(?:الساعه\s*)?(\d{1,2})(?:\s*[:.]\s*(\d{1,2}))?\s*(am|pm)?(?=\s|$)/i);
 if(clock){hour=Number(clock[1]);minute=Number(clock[2]||0);explicitMinutes=clock[2]!==undefined;}
 else {
  const hourWords=Object.keys(numberWords).sort((a,b)=>b.length-a.length);
  for(const word of hourWords){const re=new RegExp('(?:^|\\s)(?:الساعه\\s*)?'+escapeRegex(word)+'(?=\\s|$)','i');if(re.test(t)){hour=numberWords[word];break;}}
 }
 if(hour===null)return {kind:'invalid'};
 if(hour<0||hour>23||minute<0||minute>59)return {kind:'invalid'};
 const am=/صباح|فجر|\bam\b/.test(t),pm=/مساء|مغرب|عصر|ليل|عشاء|ظهر|\bpm\b|\bnoon\b/.test(t);
 const noon=/ظهر|\bnoon\b/.test(t),midnight=/منتصف\s*الليل|\bmidnight\b/.test(t);
 const tomorrow=/غدا|بكره|اليوم التالي/.test(t);
 if(hour>=1&&hour<=12&&!am&&!pm&&!explicitMinutes)return {kind:'ambiguous'};
 if(hour===12&&(am||midnight))hour=0;
 else if(hour===12&&(pm||noon))hour=12;
 else if(hour<12&&pm)hour+=12;
 const d=new Date(now);if(tomorrow)d.setDate(d.getDate()+1);d.setHours(hour,minute,0,0);
 if(d.getTime()<=now&&!tomorrow)return {kind:'past'};
 return {kind:'future',at:d.getTime()};
}
function handleAppointmentChoice(value){
 const result=parseAppointment(value);
 if(result.kind==='invalid'||result.kind==='range'){addBubble('لم أتمكن من تحديد الموعد. أعد كتابة الوقت الذي يناسبك بصيغة أوضح، من فضلك.');ask('موعد مشاهدة العرض','اكتب الوقت الذي يناسبك.','appointment','اكتب الوقت الذي يناسبك');return;}
 if(result.kind==='ambiguous'){addBubble('هل تقصد هذا الوقت صباحًا أم مساءً؟ اكتب الوقت مع تحديد الفترة.');ask('توضيح الموعد','هل تقصد صباحًا أم مساءً؟','appointment','اكتب الوقت الذي تقصده');return;}
 if(result.kind==='past'){addBubble('الوقت الذي كتبته قد مضى بحسب ساعة هاتفك. هل تقصد غدًا في الوقت نفسه، أم تختار وقتًا قادمًا؟');ask('تعديل الموعد','اكتب موعدًا قادمًا مع تحديد صباحًا أو مساءً.','appointment','اكتب الوقت الذي يناسبك');return;}
 data.time=value;data.appointmentAt=result.at;
 if(result.kind==='now'||result.at<=Date.now()){data.time=value||'الآن';showMedia();return;}
 progressMode='waiting';currentRecord.status='ينتظر موعد عرض المواد';persistRecord();
 addBubble(`تمام، سجّلت موعدك: ${value}.\nفضلاً اضبط منبّه هاتفك على هذا الوقت ليذكّرك، ثم ارجع إلى هذه المحادثة. ستظهر لك المواد عند حلول موعدك إذا بقيت الصفحة مفتوحة، أو عندما تعود بعد الموعد.`);
 showWaitingAppointment();
}
function showWaitingAppointment(){
 progressMode='waiting';
 show('موعد عرض المواد','',`<p class="small">تم حفظ موعدك: <strong>${String(data.time||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</strong></p><p class="small">لن تظهر المواد قبل الموعد. اضبط منبّه هاتفك، ثم ارجع إلى المحادثة. إذا بقيت الصفحة مفتوحة، ستظهر المواد تلقائيًا عند حلول الوقت.</p>`);
 scheduleAppointmentCheck();
}
function scheduleAppointmentCheck(){
 if(appointmentTimer)clearTimeout(appointmentTimer);
 if(progressMode!=='waiting'||!Number(data.appointmentAt))return;
 const remaining=Number(data.appointmentAt)-Date.now();
 appointmentTimer=setTimeout(checkPendingAppointment,Math.max(50,Math.min(60000,remaining)));
}
function checkPendingAppointment(){
 if(progressMode!=='waiting')return;
 const at=Number(data.appointmentAt);
 if(!at){ask('موعد مشاهدة العرض','اكتب الوقت الذي يناسبك.','appointment','اكتب الوقت بحرية');return;}
 if(Date.now()>=at){if(appointmentTimer)clearTimeout(appointmentTimer);currentRecord.status='حان موعد عرض المواد';persistRecord();showMedia();return;}
 showWaitingAppointment();
}
